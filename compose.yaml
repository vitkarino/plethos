# Plethos core stack.
#
# This file is the production-safe base: PostgreSQL and the API are private to
# the Compose network, and Caddy is the only service publishing ports.
#
#   Development:  docker compose up --build
#                 (compose.override.yaml is applied automatically)
#   Production:   docker compose -f compose.yaml up -d --build
#                 (base only — no source mounts, no exposed database)
#
# Copy `.env.example` to `.env` and set POSTGRES_PASSWORD before the first run.
# Later sprints add the Nuxt client, Redis, and the analysis worker.

name: plethos

services:
  postgres:
    # Pinned by digest as well as tag so a rebuild resolves the same image.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plethos}
      POSTGRES_USER: ${POSTGRES_USER:-plethos}
      # Required: refuse to start rather than fall back to a default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Real readiness for the dependent services below, not just "container up".
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Deliberately no `ports`: the database is reachable only from this network.
    # compose.override.yaml publishes it to localhost for development.

  # One-shot: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/server/Dockerfile
    image: plethos-server:local
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/server/Dockerfile
    image: plethos-server:local
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Same-origin through Caddy, so no cross-origin browser access is needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      QUALITY_MODEL_PATH: ${QUALITY_MODEL_PATH:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        # Never serve against a schema that has not been migrated.
        condition: service_completed_successfully
    # Deliberately no `ports`: reachable only via Caddy.

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "${PLETHOS_HTTPS_PORT:-443}:443"
      # HTTP/3.
      - "${PLETHOS_HTTPS_PORT:-443}:443/udp"
      # ACME challenges and the HTTP-to-HTTPS redirect.
      - "${PLETHOS_HTTP_PORT:-80}:80"
    environment:
      PLETHOS_SITE_ADDRESS: ${PLETHOS_SITE_ADDRESS:-localhost}
      PLETHOS_ACME_EMAIL: ${PLETHOS_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates must survive recreation or every restart re-issues them.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
